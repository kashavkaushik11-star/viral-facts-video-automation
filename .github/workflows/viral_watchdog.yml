name: Viral Facts Watchdog

on:
  workflow_dispatch:
  schedule:
    # Check twice per hour so a missed/dropped scheduled run gets recovered.
    - cron: '5,35 * * * *'

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check and recover missed publishing runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ['GH_REPO']
          raw = subprocess.check_output([
              'gh', 'run', 'list',
              '--repo', repo,
              '--workflow', 'viral_video.yml',
              '--limit', '50',
              '--json', 'databaseId,status,conclusion,createdAt,event,url'
          ], text=True)
          runs = json.loads(raw)

          now = datetime.now(timezone.utc)
          today = now.date()
          slots = [
              datetime(today.year, today.month, today.day, 3, 0, tzinfo=timezone.utc),
              datetime(today.year, today.month, today.day, 8, 0, tzinfo=timezone.utc),
              datetime(today.year, today.month, today.day, 15, 0, tzinfo=timezone.utc),
          ]

          # Only recover a slot after 45 minutes, allowing delayed GitHub schedules to start.
          due_slots = [s for s in slots if now >= s + timedelta(minutes=45)]

          def facebook_post_succeeded(run_id):
              """Return True/False when known; None if GitHub cannot verify the step."""
              try:
                  details = subprocess.check_output([
                      'gh', 'run', 'view', str(run_id),
                      '--repo', repo,
                      '--json', 'jobs'
                  ], text=True, stderr=subprocess.STDOUT)
                  jobs = json.loads(details).get('jobs', [])
                  for job in jobs:
                      for step in job.get('steps', []):
                          if step.get('name') == 'Auto-post explainer to Facebook Page':
                              return step.get('conclusion') == 'success'
              except (subprocess.CalledProcessError, json.JSONDecodeError) as exc:
                  print(f'WARN: could not inspect Facebook step for run {run_id}: {exc}')
                  return None
              return False

          for slot in due_slots:
              # Manual runs must not count as proof that a scheduled slot fired.
              candidates = []
              for r in runs:
                  if r.get('event') != 'schedule':
                      continue
                  created = datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
                  delta = (created - slot).total_seconds()
                  if -30 * 60 <= delta <= 4 * 3600:
                      candidates.append((abs(delta), created, r))

              candidates.sort(key=lambda x: x[0])
              label = slot.strftime('%Y-%m-%d %H:%M UTC')

              if any(r['status'] == 'completed' and r['conclusion'] == 'success'
                     for _, _, r in candidates):
                  print(f'OK: slot {label} has a successful scheduled workflow run.')
                  continue

              if any(r['status'] in ('queued', 'in_progress', 'requested', 'waiting', 'pending')
                     for _, _, r in candidates):
                  print(f'WAIT: slot {label} already has an active scheduled run.')
                  continue

              failed_runs = [r for _, _, r in candidates
                              if r['status'] == 'completed'
                              and r['conclusion'] in ('failure', 'timed_out', 'cancelled', 'startup_failure')]

              if failed_runs:
                  verified_no_facebook_post = []
                  uncertain_facebook_status = False
                  for r in failed_runs:
                      run_id = str(r['databaseId'])
                      fb_ok = facebook_post_succeeded(run_id)
                      if fb_ok is True:
                          print(f'NO RETRY: slot {label}; Facebook already succeeded in run {run_id}. '
                                'Skipping retries to prevent duplicate Facebook posts.')
                          uncertain_facebook_status = True
                          break
                      if fb_ok is None:
                          print(f'NO RETRY: slot {label}; cannot verify Facebook status for run {run_id}. '
                                'Skipping retries to avoid a possible duplicate post.')
                          uncertain_facebook_status = True
                          break
                      verified_no_facebook_post.append(r)

                  if not uncertain_facebook_status and verified_no_facebook_post:
                      failed = verified_no_facebook_post[0]
                      run_id = str(failed['databaseId'])
                      print(f'RETRY: slot {label} failed before Facebook success in run {run_id}; '
                            're-running failed jobs.')
                      subprocess.check_call(['gh', 'run', 'rerun', run_id, '--failed', '--repo', repo])
                  continue

              print(f'RECOVER: slot {label} has no scheduled run; dispatching the publisher now.')
              subprocess.check_call(['gh', 'workflow', 'run', 'viral_video.yml', '--ref', 'main', '--repo', repo])
          PY
