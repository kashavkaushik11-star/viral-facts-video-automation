name: Apply Gemini Parser Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('viral_video.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"  const factMatch = combined\.match\(/FACT:\\\\s\*\(\[\\s\\S\]\*\?\)\\s\*VISUAL:/i\);\n  const visualMatch = combined\.match\(/VISUAL:\\\\s\*\(\[\\s\\S\]\*\)\$/i\);\n  const fact = factMatch\?\.\[1\]\?\.trim\(\);\n  const visual = visualMatch\?\.\[1\]\?\.trim\(\);\n  if \(!fact \|\| !visual\) throw new Error\(`Gemini returned an unexpected format: \$\{combined\.slice\(0, 1000\)\}`\);"
          replacement = r'''  // Gemini can occasionally return an incomplete response. Normalize it and fall back locally.
  const normalized = String(combined || '')
    .replace(/```(?:text|markdown)?/gi, '')
    .replace(/```/g, '')
    .trim();
  let factMatch = normalized.match(/FACT:\s*([\s\S]*?)\s*VISUAL:/i);
  let visualMatch = normalized.match(/VISUAL:\s*([\s\S]*)$/i);
  let fact = factMatch?.[1]?.trim();
  let visual = visualMatch?.[1]?.trim();
  if (!fact || !visual) {
    console.log('Gemini returned incomplete FACT/VISUAL format; using local fallback.');
    const fallback = localFallback();
    factMatch = fallback.match(/FACT:\s*([\s\S]*?)\s*VISUAL:/i);
    visualMatch = fallback.match(/VISUAL:\s*([\s\S]*)$/i);
    fact = factMatch?.[1]?.trim();
    visual = visualMatch?.[1]?.trim();
  }
  if (!fact || !visual) throw new Error(`Could not create fact/visual content: ${normalized.slice(0, 1000)}`);'''
          if 'Gemini returned incomplete FACT/VISUAL format' in s:
              print('Parser fix already present.')
          else:
              ns, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Parser block not found; no changes made.')
              p.write_text(ns, encoding='utf-8')
              print('Parser patched successfully.')
          PY
      - name: Commit parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viral_video.js
          if git diff --cached --quiet; then
            echo 'No parser changes needed.'
          else
            git commit -m 'fix: resilient Gemini response parsing'
            git push
          fi
