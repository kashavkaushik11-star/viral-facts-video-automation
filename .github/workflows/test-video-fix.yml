name: Video Fix Test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig && fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply typewriter caption fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('viral_video.js')
          s = p.read_text()
          start = s.index('function createSrt(')
          end = s.index('\nfunction runFfmpeg', start)
          new_fn = r'''function createSrt(text, duration, outPath) {
  const pieces = (text.match(/[^।?!]+[।?!]?/g) || [text]).map(s => s.trim()).filter(Boolean);
  const totalChars = pieces.reduce((sum, s) => sum + Math.max(1, s.length), 0);
  let cursor = 0;
  const blocks = [];
  let index = 0;
  pieces.forEach((piece) => {
    const pieceDuration = duration * (Math.max(1, piece.length) / totalChars);
    const start = cursor;
    const end = cursor + pieceDuration;
    const chars = Array.from(piece);
    const typeTime = Math.min(pieceDuration * 0.72, Math.max(0.8, chars.length * 0.045));
    const step = typeTime / Math.max(1, chars.length);
    for (let i = 1; i <= chars.length; i++) {
      const cueStart = start + (i - 1) * step;
      const cueEnd = i === chars.length ? end : start + i * step;
      const visible = chars.slice(0, i).join('');
      index++;
      blocks.push(`${index}\n${srtTime(cueStart)} --> ${srtTime(cueEnd)}\n${wrapCaption(visible)}\n`);
    }
    cursor = end;
  });
  fs.writeFileSync(outPath, blocks.join('\n'), 'utf8');
}
'''
          s = s[:start] + new_fn + s[end:]
          s = re.sub(r"FontName=DejaVu Sans,FontSize=\d+", "FontName=DejaVu Sans,FontSize=10", s)
          p.write_text(s)
          PY
          grep -n "function createSrt\|FontName=DejaVu Sans" viral_video.js

      - name: Commit caption fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viral_video.js
          if git diff --cached --quiet; then
            echo "Caption fix already present"
          else
            git commit -m "Use 10px typewriter captions"
            git push
          fi

      - name: Generate fixed video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node viral_video.js

      - name: Upload fixed video
        uses: actions/upload-artifact@v4
        with:
          name: viral-facts-fixed-video
          path: output/
          retention-days: 3
