name: Render Short Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        type: string
      script:
        description: Hindi narration text
        required: true
        type: string
      audio_url:
        description: Public URL of generated voice MP3
        required: true
        type: string
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Prepare inputs
        env:
          TITLE: ${{ github.event.inputs.title || github.event.client_payload.title }}
          SCRIPT: ${{ github.event.inputs.script || github.event.client_payload.script }}
          AUDIO_URL: ${{ github.event.inputs.audio_url || github.event.client_payload.audio_url }}
        run: |
          printf '%s' "$TITLE" > title.txt
          printf '%s' "$SCRIPT" > script.txt
          curl -L --fail --retry 3 "$AUDIO_URL" -o voice.mp3

      - name: Render 9:16 MP4
        run: |
          bash scripts/render.sh

      - name: Publish latest video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest output.mp4 --title "Latest Auto Video" --notes "Latest generated video. Replaced automatically on each run."

      - name: Summary
        run: |
          echo "Video ready: https://github.com/${{ github.repository }}/releases/download/latest/output.mp4" >> "$GITHUB_STEP_SUMMARY"
