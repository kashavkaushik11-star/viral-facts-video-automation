name: Render Short Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        type: string
      script:
        description: Hindi narration text
        required: true
        type: string
      audio_base64:
        description: Base64 WAV/MP3 audio
        required: true
        type: string
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Prepare inputs
        env:
          TITLE: ${{ github.event.inputs.title || github.event.client_payload.title }}
          SCRIPT: ${{ github.event.inputs.script || github.event.client_payload.script }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          AUDIO_BASE64: ${{ github.event.inputs.audio_base64 || github.event.client_payload.audio_base64 }}
        run: |
          printf '%s' "$TITLE" > title.txt
          printf '%s' "$SCRIPT" > script.txt
          if [ -n "$AUDIO_BASE64" ]; then
            printf '%s' "$AUDIO_BASE64" | base64 -d > voice.wav
          elif [ -n "$AUDIO_URL" ]; then
            curl -L --fail --retry 3 "$AUDIO_URL" -o voice.mp3
          else
            echo "No audio supplied" >&2
            exit 1
          fi

      - name: Render 9:16 MP4
        run: |
          bash scripts/render.sh

      - name: Publish latest video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest output/output.mp4 --title "Latest Auto Video" --notes "Latest generated video. Replaced automatically on each run."

      - name: Notify Make
        if: ${{ always() && github.event.client_payload.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          curl -L --fail -X POST "$CALLBACK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"status\":\"$STATUS\",\"run_id\":\"$RUN_ID\",\"repository\":\"$REPO\",\"video_url\":\"https://github.com/$REPO/releases/download/latest/output.mp4\"}"
