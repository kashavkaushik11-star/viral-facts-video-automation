name: Manual Recovery Now

on:
  push:
    paths:
      - '.github/workflows/manual-recovery-now.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Google Trends Explainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run viral_video.yml --ref main --repo "${{ github.repository }}"
