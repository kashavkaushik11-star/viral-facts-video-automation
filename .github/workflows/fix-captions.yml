name: Fix Captions
on:
  push:
    paths:
      - '.github/workflows/fix-captions.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch caption styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('viral_video.js')
          s = p.read_text(encoding='utf-8')
          old = "const subtitleFilter = `subtitles=${srtPath}:force_style='FontName=Noto Sans Devanagari,FontSize=52,PrimaryColour=&H00FFFFFF,OutlineColour=&H80000000,Outline=3,Shadow=1,Alignment=2,MarginV=170,WrapStyle=2'`;"
          new = "const subtitleFilter = `subtitles=${srtPath}:force_style='FontName=Noto Sans Devanagari,FontSize=38,PrimaryColour=&H00FFFFFF,OutlineColour=&H99000000,Outline=2,Shadow=0,Alignment=2,MarginV=135,WrapStyle=2,BorderStyle=1,Spacing=0'`;"
          if old not in s:
              raise SystemExit('Expected caption filter not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viral_video.js
          git commit -m 'Improve Hindi reel caption styling'
          git push
