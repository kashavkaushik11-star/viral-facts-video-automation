name: AI & Technology Viral Videos

on:
  workflow_dispatch:
  schedule:
    # 08:30, 13:30 and 20:30 IST
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Devanagari fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig && fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply scene motion fix
        run: python scene_motion_patch.py

      - name: Generate AI & Technology video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            echo "AI/Tech video generation attempt $attempt/5"
            if node run_trends.js; then
              echo "AI/Tech video generation succeeded."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 30)); fi
          done
          echo "AI/Tech video generation failed after 5 attempts."
          exit 1

      - name: Upload AI/Tech video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-video
          path: output/
          retention-days: 3

      - name: Auto-post AI/Tech video to new Facebook Page
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.AI_TECH_FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.AI_TECH_FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            echo "AI/Tech Facebook posting attempt $attempt/5"
            if node facebook_post.js; then
              echo "AI/Tech Facebook post succeeded."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 30)); fi
          done
          echo "AI/Tech Facebook posting failed after 5 attempts."
          exit 1
