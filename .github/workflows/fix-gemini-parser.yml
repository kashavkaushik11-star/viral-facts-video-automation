name: Fix Gemini Parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: make Gemini parser resilient'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viral_video.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('viral_video.js')
          s = p.read_text(encoding='utf-8')
          old = """  const factMatch = combined.match(/FACT:\\\\s*([\\\\s\\\\S]*?)\\\\s*VISUAL:/i);\n  const visualMatch = combined.match(/VISUAL:\\\\s*([\\\\s\\\\S]*)$/i);\n  const fact = factMatch?.[1]?.trim();\n  const visual = visualMatch?.[1]?.trim();\n  if (!fact || !visual) throw new Error(`Gemini returned an unexpected format: ${combined.slice(0, 1000)}`);"""
          new = """  // Gemini may occasionally return only FACT or add markdown/code fences.\n  // Normalize the response and fall back locally instead of killing the workflow.\n  const normalized = String(combined || '')\n    .replace(/```(?:text|markdown)?/gi, '')\n    .replace(/```/g, '')\n    .trim();\n  let factMatch = normalized.match(/FACT:\\s*([\\s\\S]*?)\\s*VISUAL:/i);\n  let visualMatch = normalized.match(/VISUAL:\\s*([\\s\\S]*)$/i);\n  let fact = factMatch?.[1]?.trim();\n  let visual = visualMatch?.[1]?.trim();\n  if (!fact || !visual) {\n    console.log('Gemini returned incomplete FACT/VISUAL format; using local fallback.');\n    const fallback = localFallback();\n    factMatch = fallback.match(/FACT:\\s*([\\s\\S]*?)\\s*VISUAL:/i);\n    visualMatch = fallback.match(/VISUAL:\\s*([\\s\\S]*)$/i);\n    fact = factMatch?.[1]?.trim();\n    visual = visualMatch?.[1]?.trim();\n  }\n  if (!fact || !visual) throw new Error(`Could not create fact/visual content: ${normalized.slice(0, 1000)}`);"""
          if old not in s:
              raise SystemExit('Expected parser block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viral_video.js
          git diff --cached --quiet || git commit -m 'fix: make Gemini parser resilient'
          git push
