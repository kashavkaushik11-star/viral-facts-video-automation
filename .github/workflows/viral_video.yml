name: Google Trends Explainer

on:
  workflow_dispatch:
  schedule:
    # India audience: 08:30, 13:30 and 20:30 IST (03:00, 08:00 and 15:00 UTC)
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Devanagari fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig && fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply scene motion fix
        run: python scene_motion_patch.py

      - name: Generate Google Trends explainer video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node run_trends.js

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: google-trends-explainer
          path: output/
          retention-days: 3

      # Manual runs are for review only. Scheduled runs publish automatically.
      - name: Auto-post explainer to Facebook Page
        if: success() && github.event_name == 'schedule'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node facebook_post.js

      - name: WhatsApp notification after successful Facebook post
        if: success() && github.event_name == 'schedule'
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: node whatsapp_notify.js
