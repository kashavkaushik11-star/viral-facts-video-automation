name: Google Trends Explainer

on:
  workflow_dispatch:
  schedule:
    # India audience: 08:30, 13:30 and 20:30 IST (03:00, 08:00 and 15:00 UTC)
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Devanagari fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig && fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply scene motion fix
        run: python scene_motion_patch.py

      - name: Generate Google Trends explainer video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node run_trends.js

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: google-trends-explainer
          path: output/
          retention-days: 3

      # Scheduled and manual runs both publish, allowing a complete live test.
      - name: Auto-post explainer to Facebook Page
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node facebook_post.js

      - name: Auto-post same video to YouTube Shorts
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "YouTube OAuth secrets are not configured yet; skipping YouTube upload."
            exit 0
          fi
          node youtube_upload.js

      - name: Send ntfy notification
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node ntfy_notify.js
