name: Kaggle AI Video Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install -U kaggle

      - name: Run Kaggle AI Video Generator
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          set -euo pipefail

          echo "Kaggle kernel: $KAGGLE_KERNEL_ID"

          rm -rf kaggle_kernel kaggle_output
          mkdir -p kaggle_kernel kaggle_output

          echo "Downloading current Kaggle notebook..."
          kaggle kernels pull "$KAGGLE_KERNEL_ID" -m -p kaggle_kernel

          echo "Starting Kaggle notebook..."
          kaggle kernels push -p kaggle_kernel

          echo "Waiting for Kaggle run..."
          for i in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1 || true)"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi "complete|completed|success"; then
              echo "Kaggle run completed."
              break
            fi

            if echo "$STATUS" | grep -Eqi "error|failed"; then
              echo "Kaggle run failed."
              exit 1
            fi

            sleep 30
          done

          echo "Downloading Kaggle output..."
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p kaggle_output -o

          echo "Kaggle output files:"
          find kaggle_output -type f -maxdepth 5 -print

          MP4="$(find kaggle_output -type f -iname '*.mp4' | head -n 1 || true)"
          if [ -z "$MP4" ]; then
            echo "No MP4 was produced by the Kaggle notebook."
            echo "The notebook must save the generated video as a Kaggle output file."
            exit 1
          fi

          mkdir -p output
          cp "$MP4" output/output.mp4
          ls -lh output/output.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-ai-video
          path: output/output.mp4
          retention-days: 3
