name: Trigger Video Test
on:
  push:
    paths:
      - '.github/workflows/trigger-video-test.yml'
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Viral Facts Video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/viral_video.yml/dispatches \
            -d '{"ref":"main"}'
